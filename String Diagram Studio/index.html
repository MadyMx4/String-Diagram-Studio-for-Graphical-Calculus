<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18343a">
  <title>String Diagram Studio</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18343a;
      --ink-soft: #456168;
      --paper: #f2f6f4;
      --surface: #ffffff;
      --line: #d4e0dc;
      --line-strong: #b7cbc5;
      --hopf: #007d72;
      --hopf-wash: #e1f2ee;
      --tensor: #c7543c;
      --tensor-wash: #fff0e9;
      --focus: #c83f4c;
      --shadow: 0 12px 34px rgb(24 52 58 / 8%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d5e0dc 0.7px, transparent 0.7px);
      background-size: 18px 18px;
    }

    button, select { font: inherit; }

    button:focus-visible, select:focus-visible, .grid-cell:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      z-index: 2;
    }

    .app-header {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 12px clamp(16px, 3vw, 36px);
      color: #f6fbf8;
      background: var(--ink);
      border-bottom: 3px solid #76b8a8;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #8fc9b8;
      color: #b6e3d7;
      font: italic 700 20px Georgia, serif;
      transform: rotate(-7deg);
    }

    .brand-title {
      margin: 0;
      overflow: hidden;
      color: #f6fbf8;
      font: 600 19px Georgia, "Times New Roman", serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-note {
      color: #c2d3d0;
      font-size: 12px;
      white-space: nowrap;
    }

    .workspace {
      width: min(1480px, 100%);
      min-height: calc(100vh - 68px);
      display: grid;
      grid-template-columns: minmax(220px, 276px) minmax(0, 1fr);
      margin: 0 auto;
    }

    .tool-rail {
      padding: 28px 22px;
      background: rgb(255 255 255 / 80%);
      border-right: 1px solid var(--line);
    }

    .rail-heading, .canvas-kicker, .field-label {
      margin: 0;
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .rail-heading { margin-bottom: 24px; }

    .menu-group {
      padding: 0 0 22px;
      margin: 0 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .menu-group:last-of-type { margin-bottom: 26px; }

    .menu-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 11px;
      font-size: 14px;
      font-weight: 700;
    }

    .menu-title::before {
      width: 8px;
      height: 8px;
      content: "";
      background: var(--hopf);
      border-radius: 50%;
    }

    .menu-group.tensor .menu-title::before { background: var(--tensor); }

    .diagram-tool-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }

    .diagram-tool {
      position: relative;
      min-width: 0;
      min-height: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      cursor: pointer;
    }

    .diagram-tool:hover { background: #f8fbf9; }
    .diagram-tool[aria-pressed="true"] { color: var(--tensor); border-color: var(--tensor); background: var(--tensor-wash); }
    .diagram-tool svg { width: 46px; height: 24px; overflow: visible; }
    .diagram-tool span { font-size: 11px; }

    .key-hint {
      color: inherit;
      font: 10px/1 Consolas, "Courier New", monospace;
    }

    .diagram-tool .key-hint {
      position: absolute;
      top: 4px;
      right: 5px;
      padding: 2px 3px;
      border: 1px solid currentColor;
      border-radius: 2px;
    }

    .action-button .key-hint {
      margin-left: 3px;
      padding: 1px 3px;
      border: 1px solid currentColor;
      border-radius: 2px;
    }

    .active-tool {
      min-height: 64px;
      padding: 12px 13px;
      background: #edf3f1;
      border-left: 3px solid var(--line-strong);
    }

    .active-tool[data-category="hopf"] { border-left-color: var(--hopf); }
    .active-tool[data-category="tensor"] { border-left-color: var(--tensor); }
    .active-tool[data-category="text"] { border-left-color: var(--hopf); }
    .active-tool[data-category="bullet"] { border-left-color: var(--ink); }

    .active-label {
      display: block;
      margin-top: 5px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .active-instructions {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.4;
    }

    .active-instructions[hidden] { display: none; }

    .rail-footer {
      margin-top: 24px;
      color: #738a88;
      font: italic 13px Georgia, serif;
    }

    .canvas-area {
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 3vw, 38px);
    }

    .canvas-toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line-strong);
    }

    .canvas-title {
      margin: 5px 0 0;
      font: 600 23px Georgia, "Times New Roman", serif;
    }

    .canvas-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .canvas-zoom {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .zoom-button {
      width: 31px;
      min-height: 31px;
      padding: 0;
      font-size: 17px;
    }

    .zoom-reset-button {
      width: auto;
      min-width: 42px;
      padding: 0 5px;
      font-size: 10px;
    }

    .zoom-level {
      min-width: 42px;
      color: var(--ink-soft);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .color-palette {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 5px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .color-palette[hidden] { display: none; }

    .connection-layer-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .connection-layer-controls[hidden] { display: none; }

    .layer-button {
      width: 30px;
      min-height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--ink-soft);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
    }

    .layer-button[aria-pressed="true"] {
      color: var(--ink);
      border-color: var(--line-strong);
      background: #edf3f1;
    }

    .layer-button svg { width: 17px; height: 17px; }

    .color-swatch {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 50%;
      cursor: pointer;
    }

    .color-swatch[aria-pressed="true"] { border-color: var(--ink); }

    .color-swatch::before {
      width: 12px;
      height: 12px;
      content: "";
      background: var(--swatch-color);
      border: 1px solid rgb(24 52 58 / 22%);
      border-radius: 50%;
    }

    .action-button {
      min-height: 35px;
      padding: 7px 11px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 3px;
      cursor: pointer;
    }

    .action-button:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--line-strong);
      background: #f8fbf9;
    }

    .action-button:disabled { opacity: 0.42; cursor: default; }
    .action-button.clear { color: #a84735; }
    .history-icon-button {
      width: 36px;
      min-height: 35px;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .history-icon-button svg { width: 18px; height: 18px; }
    .action-button.draw-box[aria-pressed="true"] {
      color: var(--tensor);
      border-color: var(--tensor);
      background: var(--tensor-wash);
    }

    .action-button.draw-circle[aria-pressed="true"] {
      color: var(--ink);
      border-color: var(--ink);
      background: #e8edef;
    }

    .action-button.text-node[aria-pressed="true"] {
      color: var(--hopf);
      border-color: var(--hopf);
      background: var(--hopf-wash);
    }

    .box-editor {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px;
      background: #edf3f1;
      border: 1px solid var(--line);
    }

    .box-editor[hidden] { display: none; }
    .box-editor label { color: var(--ink-soft); font-size: 11px; }
    .box-editor input {
      width: 132px;
      min-width: 110px;
      min-height: 32px;
      padding: 5px 7px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
    }

    .circle-label {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.1;
      text-align: center;
      pointer-events: none;
      border-radius: 50%;
    }

    .latex-dialog {
      width: min(760px, calc(100vw - 32px));
      max-width: none;
      max-height: min(80vh, 720px);
      padding: 0;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
    }

    .latex-dialog::backdrop { background: rgb(24 52 58 / 48%); }
    .latex-dialog-content { display: grid; gap: 14px; padding: 18px; }
    .latex-dialog-header,
    .latex-dialog-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .latex-dialog-title { margin: 0; font: 600 20px Georgia, "Times New Roman", serif; }
    .latex-dialog textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      padding: 12px;
      color: var(--ink);
      background: #f6f9f7;
      border: 1px solid var(--line-strong);
      font: 12px/1.5 Consolas, "Courier New", monospace;
      white-space: pre;
    }
    .latex-copy-status { min-height: 1em; color: var(--ink-soft); font-size: 12px; }

    .board-stage {
      min-height: 0;
      flex: 1;
      display: flex;
      padding: clamp(24px, 6vh, 72px) 0;
    }

    .canvas-viewport {
      width: 100%;
      height: min(68vh, 640px);
      min-height: 280px;
      flex: 0 1 auto;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .canvas-board {
      width: max-content;
      margin: 0 auto;
    }

    .canvas-board-top,
    .canvas-board-content,
    .canvas-board-bottom {
      display: flex;
    }

    .canvas-board-top,
    .canvas-board-bottom { height: 28px; }
    .grid-edge-space,
    .grid-add-column,
    .grid-add-column-right { width: 28px; flex: 0 0 28px; }

    .grid-edge-control {
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--hopf);
      background: #eaf5f1;
      border: 0;
      cursor: pointer;
    }

    .grid-edge-control:hover {
      color: #fff;
      background: var(--hopf);
    }

    .grid-edge-control svg { width: 18px; height: 18px; }
    .grid-add-row { flex: 1; }

    .diagram-grid {
      position: relative;
      width: min(100%, 980px);
      flex: none;
      margin: 0 auto;
      aspect-ratio: 12 / 8;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      overflow: hidden;
      background: #fff;
      border-top: 1px solid var(--line-strong);
      border-left: 1px solid var(--line-strong);
      box-shadow: var(--shadow);
    }

    .wire-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .wire-line {
      stroke: var(--connection-color, #171b1c);
      stroke-width: 3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .wire-curve { fill: none; }
    .wire-line.is-selected {
      stroke: var(--connection-color, #171b1c);
      stroke-width: 4;
      filter: drop-shadow(0 0 2px var(--focus));
    }

    .wire-underlay {
      fill: none;
      stroke: #fff;
      stroke-width: 10px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .wire-hit-area {
      fill: none;
      stroke: transparent;
      stroke-width: 18px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: pointer;
    }

    .wire-preview {
      stroke: #007d72;
      stroke-dasharray: 5 5;
      opacity: 0.75;
      pointer-events: none;
    }

    .diagram-box {
      fill: #fff;
      stroke: #171b1c;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: all; /* Enable interaction with the box interior */
    }

    .diagram-box.is-selected {
      fill: #fff;
      stroke: var(--focus);
      stroke-width: 3;
    }

    .diagram-circle {
      fill: #fff;
      stroke: var(--circle-color, #171b1c);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      pointer-events: stroke;
      cursor: pointer;
    }

    .diagram-circle.is-selected {
      stroke: var(--circle-color, #171b1c);
      filter: drop-shadow(0 0 2px var(--focus));
    }

    .multiplication-port-highlight {
      fill: var(--focus);
      stroke: #fff;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .box-label {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 3px;
      color: var(--ink);
      font-size: 22px;
      line-height: 1.15;
      text-align: center;
      pointer-events: none;
    }

    .marker.math-marker {
      width: max-content;
      max-width: 180px;
      min-width: 36px;
      min-height: 34px;
      height: auto;
      aspect-ratio: auto;
      padding: 5px 8px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      font: 16px "Trebuchet MS", "Segoe UI", sans-serif;
      white-space: nowrap;
    }

    .marker.bullet-marker {
      width: 9px;
      height: 9px;
      aspect-ratio: 1;
      color: var(--bullet-color, #171b1c);
      background: var(--bullet-color, #171b1c);
      border: 0;
      border-radius: 50%;
      font-size: 0;
    }

    .box-preview {
      fill: rgb(199 84 60 / 5%);
      stroke-dasharray: 5 4;
      opacity: 0.8;
    }

    .grid-cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 0;
      background: transparent;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: crosshair;
    }

    .grid-cell:hover:not(.occupied) { background: #f4f9f7; }
    .grid-cell.occupied { cursor: grab; }
    .diagram-grid.is-wiring { cursor: grabbing; }
    .diagram-grid.is-boxing { cursor: crosshair; }
    .diagram-grid.is-circling { cursor: crosshair; }
    .grid-cell.is-selected .marker { filter: drop-shadow(0 0 3px var(--focus)); }
    .grid-cell.is-selected .point-marker { box-shadow: 0 0 0 5px rgb(200 63 76 / 28%); }
    .grid-cell.is-multiplication-source .marker { box-shadow: 0 0 0 4px rgb(200 63 76 / 48%); }
    .grid-cell.is-multiplication-source .point-marker { box-shadow: 0 0 0 5px rgb(200 63 76 / 48%); }
    .diagram-grid.is-placing .grid-cell:not(.occupied) { cursor: copy; }
    .diagram-grid.is-placing .grid-cell:not(.occupied):hover { background: #eaf5f1; }

    .marker {
      position: relative;
      z-index: 2;
      width: min(78%, 54px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      color: var(--hopf);
      background: var(--hopf-wash);
      border: 1.5px solid currentColor;
      border-radius: 50%;
      font: 700 clamp(13px, 1.8vw, 19px) Georgia, serif;
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }

    .marker[data-category="tensor"] {
      color: var(--tensor);
      background: var(--tensor-wash);
    }

    .marker.long { font: 700 clamp(8px, 1.1vw, 11px) "Trebuchet MS", sans-serif; }
    .point-marker {
      position: relative;
      z-index: 2;
      width: 9px;
      height: 9px;
      background: #b8d6e8;
      border: 1px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #9fc6de;
      pointer-events: none;
    }

    .canvas-status {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      color: var(--ink-soft);
      border-top: 1px solid var(--line-strong);
      font-size: 12px;
    }

    .status-text { min-width: 0; }
    .cell-count { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .status-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }

    @media (max-width: 760px) {
      .workspace { grid-template-columns: 1fr; }
      .tool-rail {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 12px;
        padding: 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .rail-heading { grid-column: 1 / -1; margin: 0; }
      .menu-group { padding: 0; margin: 0; border: 0; }
      .menu-group:last-of-type { margin: 0; }
      .active-tool { grid-column: 1 / -1; min-height: 54px; }
      .rail-footer { display: none; }
      .canvas-area { padding: 19px 14px 16px; }
      .canvas-toolbar { align-items: center; }
      .canvas-title { font-size: 20px; }
      .board-stage { padding: 30px 0; }
      .canvas-viewport { min-height: 240px; }
    }

    @media (max-width: 430px) {
      .header-note { display: none; }
      .canvas-toolbar { align-items: flex-start; flex-direction: column; }
      .canvas-actions { justify-content: flex-start; }
      .action-button { min-height: 32px; padding: 6px 9px; font-size: 12px; }
      .canvas-status { align-items: flex-start; flex-direction: column; gap: 4px; }
    }
  </style>
  <script>
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"]] },
      startup: { typeset: false }
    };
  </script>
  <script id="mathjax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">S</span>
      <h1 class="brand-title">String Diagram Studio</h1>
    </div>
    <span class="header-note">GRAPHICAL CALCULUS</span>
  </header>

  <main class="workspace">
    <aside class="tool-rail" aria-label="Diagram tools">
      <h2 class="rail-heading">Diagram tools</h2>

      <section class="menu-group tensor">
        <h3 class="menu-title">Nodes and connections</h3>
        <div class="diagram-tool-list" aria-label="Bullet, evaluation, and coevaluation tools">
          <button class="diagram-tool" id="evaluation-button" type="button" aria-label="Evaluation" aria-keyshortcuts="E" aria-pressed="false" title="Drag between two nodes to draw a cap">
            <svg viewBox="0 0 48 24" fill="none" aria-hidden="true"><path d="M4 20 C10 4, 38 4, 44 20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" /></svg>
            <span>Eval</span>
            <kbd class="key-hint" aria-hidden="true">E</kbd>
          </button>
          <button class="diagram-tool" id="coevaluation-button" type="button" aria-label="Coevaluation" aria-keyshortcuts="C" aria-pressed="false" title="Drag between two nodes to draw a cup">
            <svg viewBox="0 0 48 24" fill="none" aria-hidden="true"><path d="M4 4 C10 20, 38 20, 44 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" /></svg>
            <span>Co-eval</span>
            <kbd class="key-hint" aria-hidden="true">C</kbd>
          </button>
          <button class="diagram-tool" id="bullet-button" type="button" aria-label="Bullet point" aria-keyshortcuts="B" aria-pressed="false" title="Place a black bullet point node">
            <svg viewBox="0 0 48 24" aria-hidden="true"><circle cx="24" cy="12" r="4.5" fill="currentColor" /></svg>
            <span>Bullet</span>
            <kbd class="key-hint" aria-hidden="true">B</kbd>
          </button>

    function announce(message) {
      statusText.textContent = message;
      statusLive.textContent = message;
    }

    function hasNode(index) {
      return Boolean(cells[index]) || points.has(index);
    }

    function scheduleMathTypeset() {
      if (mathTypesetRunning) {
        mathTypesetAgain = true;
        return;
      }
      if (mathTypesetScheduled) return;
      mathTypesetScheduled = true;
      requestAnimationFrame(async () => {
        mathTypesetScheduled = false;
        mathTypesetRunning = true;
        try {
          if (!await mathJaxReady) return;
          await window.MathJax.startup.promise;
          window.MathJax.typesetClear([grid]);
          await window.MathJax.typesetPromise([grid]);
        } catch (error) {
          console.error("Unable to render a LaTeX expression", error);
        } finally {
          mathTypesetRunning = false;
          if (mathTypesetAgain) {
            mathTypesetAgain = false;
            scheduleMathTypeset();
          }
        }
      });
    }

    function gridPointAt(clientX, clientY) {
      const rect = grid.getBoundingClientRect();
      const snap = (value, limit) => Math.max(0, Math.min(limit, Math.round(value * 2) / 2));
      return {
        x: snap(((clientX - rect.left) / rect.width) * columns, columns),
        y: snap(((clientY - rect.top) / rect.height) * rows, rows)
      };
    }

    function gridPositionAt(clientX, clientY) {
      const rect = grid.getBoundingClientRect();
      return {
        x: ((clientX - rect.left) / rect.width) * columns,
        y: ((clientY - rect.top) / rect.height) * rows
      };
    }

    function circleCardinalEndpointAt(point) {
      const rect = grid.getBoundingClientRect();
      let nearest = null;
      let nearestDistance = Infinity;
      circles.forEach((circle) => {
        const candidates = [
          { side: "north", x: circle.x, y: circle.y - circle.radius },
          { side: "south", x: circle.x, y: circle.y + circle.radius },
          { side: "east", x: circle.x + circle.radius, y: circle.y },
          { side: "west", x: circle.x - circle.radius, y: circle.y }
        ];
        candidates.forEach((candidate) => {
          const distance = Math.hypot(
            (point.x - candidate.x) * rect.width / columns,
            (point.y - candidate.y) * rect.height / rows
          );
          if (distance < nearestDistance) {
            nearest = { circleId: circle.id, ...candidate };
            nearestDistance = distance;
          }
        });
      });
      return nearestDistance <= 14 ? nearest : null;
    }

    function updateCanvasZoom() {
      const baseWidth = Math.min(canvasViewport.clientWidth, 980);
      const gridWidth = Math.round(baseWidth * canvasZoom);
      grid.style.width = `${gridWidth}px`;
      canvasBoard.style.width = `${gridWidth + 56}px`;
      zoomLevel.textContent = `${Math.round(canvasZoom * 100)}%`;
      zoomOutButton.disabled = canvasZoom <= 0.5;
      zoomInButton.disabled = canvasZoom >= 3;
    }

    function updateGridDimensions() {
      grid.style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
      grid.style.aspectRatio = `${columns} / ${rows}`;
      grid.setAttribute("aria-label", `${columns} by ${rows} diagram grid`);
      wireLayer.setAttribute("viewBox", `0 0 ${columns} ${rows}`);
      updateCanvasZoom();
    }

    function setCanvasZoom(nextZoom) {
      canvasZoom = Math.max(0.5, Math.min(3, Math.round(nextZoom * 10) / 10));
      updateCanvasZoom();
      requestAnimationFrame(() => {
        canvasViewport.scrollLeft = Math.max(0, (canvasViewport.scrollWidth - canvasViewport.clientWidth) / 2);
        canvasViewport.scrollTop = Math.max(0, (canvasViewport.scrollHeight - canvasViewport.clientHeight) / 2);
      });
    }
