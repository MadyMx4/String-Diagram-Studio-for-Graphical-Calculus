      updateGridDimensions();
      if (window.MathJax?.typesetClear) window.MathJax.typesetClear([grid]);
      grid.replaceChildren(wireLayer);
      cells.forEach((operationKey, index) => {
        // Flat storage keeps responsive grid cells mapped to stable row/column coordinates.
        const row = Math.floor(index / columns) + 1;
        const column = (index % columns) + 1;
        const cell = document.createElement("button");
        cell.className = "grid-cell";
        cell.type = "button";
        cell.setAttribute("role", "gridcell");
        cell.dataset.index = String(index);
        cell.title = `Column ${column}, row ${row}`;

        if (operationKey) {
          const operation = operations[operationKey];
          cell.classList.add("occupied");
          if (index === selectedCellIndex) cell.classList.add("is-selected");
          if (multiplicationSelection.some((endpoint) => endpointKey(endpoint) === endpointKey(index))) cell.classList.add("is-multiplication-source");
          const isTextNode = operationKey === "text";
          const isBullet = operationKey === "bullet";
          cell.setAttribute("aria-label", `${isTextNode ? "Text node" : operation.label}, column ${column}, row ${row}`);
          const marker = document.createElement("span");
          marker.className = "marker";
          if (isTextNode) {
            marker.classList.add("math-marker");
            const value = index === selectedCellIndex && textNodeDraft !== null
              ? textNodeDraft
              : (textNodeValues.get(index) || operation.symbol);
            marker.textContent = `\\(${value}\\)`;
          } else if (isBullet) {
            marker.classList.add("bullet-marker");
            marker.style.setProperty("--bullet-color", diagramColors[bulletColors.get(index) || "black"].css);
          } else if (operation.symbol.length > 1) {
            marker.classList.add("long");
            marker.textContent = operation.symbol;
          } else {
            marker.textContent = operation.symbol;
          }
          marker.dataset.category = operation.category;
          marker.dataset.operation = operationKey;
          marker.setAttribute("aria-hidden", "true");
          cell.append(marker);
        } else if (points.has(index)) {
          cell.classList.add("occupied");
          if (index === selectedCellIndex) cell.classList.add("is-selected");
          if (multiplicationSelection.some((endpoint) => endpointKey(endpoint) === endpointKey(index))) cell.classList.add("is-multiplication-source");
          cell.setAttribute("aria-label", `Orientation point, column ${column}, row ${row}`);
          const point = document.createElement("span");
          point.className = "point-marker";
          point.setAttribute("aria-hidden", "true");
          cell.append(point);
        } else {
          cell.setAttribute("aria-label", `Empty, column ${column}, row ${row}`);
        }

        grid.append(cell);
      });
      grid.classList.toggle("is-placing", Boolean(selectedOperation || textNodeMode));
      grid.classList.toggle("is-boxing", boxMode);
      grid.classList.toggle("is-circling", circleMode);
      renderConnections();
      updateActions();
      updateCount();
      updateBoxEditor();
      updateCircleEditor();
      updateTextNodeEditor();
      updateColorPalette();
    }

    function boxAtInterior(point) {
      for (let index = boxes.length - 1; index >= 0; index -= 1) {
        const box = boxes[index];
        const right = box.x + box.width;
        const bottom = box.y + box.height;
        const inside = point.x >= box.x && point.x <= right && point.y >= box.y && point.y <= bottom;
        const edgeDistance = Math.min(Math.abs(point.x - box.x), Math.abs(point.x - right), Math.abs(point.y - box.y), Math.abs(point.y - bottom));
        if (inside && edgeDistance > 0.25) return index;
      }
      return null;
    }

    function boxBorderEndpoint(point) {
      for (let index = boxes.length - 1; index >= 0; index -= 1) {
        const box = boxes[index];
        const right = box.x + box.width;
        const bottom = box.y + box.height;
        if (point.x < box.x - 0.25 || point.x > right + 0.25 || point.y < box.y - 0.25 || point.y > bottom + 0.25) continue;

        const edges = [
          { distance: Math.abs(point.x - box.x), x: box.x, y: point.y, horizontal: false },
          { distance: Math.abs(point.x - right), x: right, y: point.y, horizontal: false },
          { distance: Math.abs(point.y - box.y), x: point.x, y: box.y, horizontal: true },
          { distance: Math.abs(point.y - bottom), x: point.x, y: bottom, horizontal: true }
        ].sort((first, second) => first.distance - second.distance)[0];
        if (edges.distance > 0.25) continue;

        const coordinate = edges.horizontal ? edges.x : edges.y;
        const minimum = edges.horizontal ? box.x : box.y;
        const maximum = edges.horizontal ? right : bottom;
        const snapped = Math.max(minimum, Math.min(maximum, Math.round(coordinate * 2) / 2));
        return {
          boxId: box.id,
          x: edges.horizontal ? snapped : edges.x,
          y: edges.horizontal ? edges.y : snapped
        };
      }
      return null;
    }

    function wireEndpointAt(event) {
      const point = gridPositionAt(event.clientX, event.clientY);
      const boxEndpoint = boxBorderEndpoint(point);
      if (boxEndpoint) return boxEndpoint;
      const circleEndpoint = circleCardinalEndpointAt(point);
      if (circleEndpoint) return circleEndpoint;
      const cell = event.target.closest?.(".grid-cell");
      if (cell && hasNode(Number(cell.dataset.index))) return Number(cell.dataset.index);

      const rect = grid.getBoundingClientRect();
      let nearestNode = null;
      let nearestDistance = Infinity;
      cells.forEach((operation, index) => {
        if (!operation && !points.has(index)) return;
        const endpoint = endpointFor(index);
        const distance = Math.hypot(
          (point.x - endpoint.x) * rect.width / columns,
          (point.y - endpoint.y) * rect.height / rows
        );
        if (distance < nearestDistance) {
          nearestNode = index;
          nearestDistance = distance;
        }
      });

      return nearestDistance <= 12 ? nearestNode : null;
    }

    function endpointKey(endpoint) {
      if (typeof endpoint === "number") return `cell:${endpoint}`;
      if (endpoint.circleId !== undefined) return `circle:${endpoint.circleId}:${endpoint.side}`;
      return `box:${endpoint.boxId}:${endpoint.x}:${endpoint.y}`;
    }

    function selectBox(index) {
      textNodeMode = false;
      textNodeButton.setAttribute("aria-pressed", "false");
      activeLabel.textContent = "None";
      activeTool.dataset.category = "";
      selectedBoxIndex = index;
      selectedCellIndex = null;
      selectedCircleIndex = null;
      selectedConnectionIndex = null;
      boxLabelDraft = boxes[index].text || "";
      boxLabelInput.value = boxLabelDraft;
      renderConnections();
      updateBoxEditor();
      updateTextNodeEditor();
      announce("Box selected; edit its centered text or delete it");
    }

    function selectCircle(index) {
      circleMode = false;
      circleButton.setAttribute("aria-pressed", "false");
      selectedCircleIndex = index;
      selectedCellIndex = null;
      selectedBoxIndex = null;
      selectedConnectionIndex = null;
      boxLabelDraft = null;
      circleLabelDraft = circles[index].text || "";
      circleLabelInput.value = circleLabelDraft;
      textNodeDraft = null;
      updateBoxEditor();
      updateCircleEditor();
      updateTextNodeEditor();
      updateColorPalette();
      renderConnections();
      announce("Circle selected; edit its LaTeX label or delete it");
    }

    function updateBoxEditor() {
      const box = boxes[selectedBoxIndex];
      boxEditor.hidden = !box;
      if (box && document.activeElement !== boxLabelInput) {
        boxLabelDraft = box.text || "";
        boxLabelInput.value = boxLabelDraft;
      }
    }

    function updateCircleEditor() {
      const circle = circles[selectedCircleIndex];
      circleEditor.hidden = !circle;
      if (circle && document.activeElement !== circleLabelInput) {
        circleLabelDraft = circle.text || "";
        circleLabelInput.value = circleLabelDraft;
      }
    }

    function updateTextNodeEditor() {
      const isSelectedTextNode = selectedCellIndex !== null && cells[selectedCellIndex] === "text";
      textNodeEditor.hidden = !isSelectedTextNode;
      if (isSelectedTextNode && document.activeElement !== textNodeInput) {
        textNodeDraft = textNodeValues.get(selectedCellIndex) || "x";
        textNodeInput.value = textNodeDraft;
      }
    }

    function updateColorPalette() {
      const canEditColor = selectedOperation !== "multiplication";
      const hasConnection = canEditColor && selectedConnectionIndex !== null;
      const hasBullet = canEditColor && selectedCellIndex !== null && cells[selectedCellIndex] === "bullet";
      const hasBox = canEditColor && selectedBoxIndex !== null;
      const hasCircle = canEditColor && selectedCircleIndex !== null;
      colorPalette.hidden = !hasConnection && !hasBullet && !hasBox && !hasCircle;
      const color = hasConnection
        ? (connections[selectedConnectionIndex]?.color || "black")
        : (hasBullet
          ? (bulletColors.get(selectedCellIndex) || "black")
          : (hasBox
            ? (boxes[selectedBoxIndex]?.color || "black")
            : (hasCircle ? (circles[selectedCircleIndex]?.color || "black") : "black")));
      colorSwatches.forEach((swatch) => {
        swatch.setAttribute("aria-pressed", String((hasConnection || hasBullet || hasBox || hasCircle) && swatch.dataset.color === color));
      });
    }

    function updateConnectionLayerControls() {
      const connection = connections[selectedConnectionIndex];
      connectionLayerControls.hidden = !connection;
      connectionUpButton.setAttribute("aria-pressed", String(connection?.layer === "up"));
      connectionDownButton.setAttribute("aria-pressed", String(connection && connection.layer !== "up"));
    }

    function setConnectionLayer(layer) {
      const connection = connections[selectedConnectionIndex];
      if (!connection || (layer !== "up" && layer !== "down") || (connection.layer || "down") === layer) return;
      snapshot();
      connection.layer = layer;
      announce(layer === "up" ? "Connection raised above crossings" : "Connection lowered below crossings");
      renderConnections();
      updateActions();
    }

    function applyColorToSelection(color) {
      if (!diagramColors[color] || selectedOperation === "multiplication") return;
      if (selectedConnectionIndex !== null) {
        snapshot();
        connections[selectedConnectionIndex].color = color;
        announce(`${color[0].toUpperCase()}${color.slice(1)} connection color`);
        renderConnections();
        updateActions();
      } else if (selectedCellIndex !== null && cells[selectedCellIndex] === "bullet") {
        snapshot();
        bulletColors.set(selectedCellIndex, color);
        announce(`${color[0].toUpperCase()}${color.slice(1)} bullet color`);
        renderGrid();
      } else if (selectedBoxIndex !== null) {
        snapshot();
        boxes[selectedBoxIndex].color = color;
        announce(`${color[0].toUpperCase()}${color.slice(1)} box boundary`);
        renderConnections();
        updateActions();
      } else if (selectedCircleIndex !== null) {
        snapshot();
        circles[selectedCircleIndex].color = color;
        announce(`${color[0].toUpperCase()}${color.slice(1)} circle boundary`);
        renderConnections();
        updateActions();
      }
    }

    function commitBoxLabel() {
      const box = boxes[selectedBoxIndex];
      if (!box) return;
      const nextText = boxLabelDraft ?? boxLabelInput.value;
      if ((box.text || "") !== nextText) {
        snapshot();
        box.text = nextText;
      }
      boxLabelDraft = box.text || "";
      renderConnections();
      updateActions();
    }

    function commitCircleLabel() {
      const circle = circles[selectedCircleIndex];
      if (!circle) return;
      const nextText = circleLabelDraft ?? circleLabelInput.value;
      if ((circle.text || "") !== nextText) {
        snapshot();
        circle.text = nextText;
      }
      circleLabelDraft = circle.text || "";
      renderConnections();
      updateActions();
    }

    function commitTextNode() {
      if (selectedCellIndex === null || cells[selectedCellIndex] !== "text") return;
      const nextText = textNodeDraft ?? textNodeInput.value;
      if ((textNodeValues.get(selectedCellIndex) || "x") !== nextText) {
        snapshot();
        textNodeValues.set(selectedCellIndex, nextText);
      }
      textNodeDraft = nextText;
      renderGrid();
    }

    function deleteSelectedBox() {
      if (selectedBoxIndex === null) return;
      commitBoxLabel();
      snapshot();
      const [deletedBox] = boxes.splice(selectedBoxIndex, 1);
      for (let index = connections.length - 1; index >= 0; index -= 1) {
        if (connectionUsesShapeEndpoint(connections[index], "boxId", deletedBox.id)) connections.splice(index, 1);
      }
      selectedBoxIndex = null;
      selectedConnectionIndex = null;
      boxLabelDraft = null;
      announce("Box deleted");
      renderGrid();
    }

    function deleteSelectedCircle() {
      if (selectedCircleIndex === null) return;
      commitCircleLabel();
      snapshot();
      const [deletedCircle] = circles.splice(selectedCircleIndex, 1);
      for (let index = connections.length - 1; index >= 0; index -= 1) {
        if (connectionUsesShapeEndpoint(connections[index], "circleId", deletedCircle.id)) connections.splice(index, 1);
      }
      selectedCircleIndex = null;
      selectedConnectionIndex = null;
      circleLabelDraft = null;
      announce("Circle deleted");
      renderGrid();
    }

    function endpointFor(index) {
      if (typeof index !== "number") return { x: index.x, y: index.y };
      return { x: (index % columns) + 0.5, y: Math.floor(index / columns) + 0.5 };
    }

    function connectionUsesNode(connection, index) {
      return connection.kind === "multiplication"
        ? connection.sources.includes(index) || connection.target === index
        : connection.from === index || connection.to === index;
    }

    function connectionUsesShapeEndpoint(connection, key, id) {
      const endpoints = connection.kind === "multiplication"
        ? [...connection.sources, connection.target]
        : [connection.from, connection.to];
      return endpoints.some((endpoint) => typeof endpoint !== "number" && endpoint[key] === id);
    }

    function nodeNearConnectionEndpoint(connection, clientX, clientY) {
      const endpoints = connection.kind === "multiplication"
        ? [...connection.sources, connection.target]
        : [connection.from, connection.to];
      const rect = grid.getBoundingClientRect();
      return endpoints.find((endpoint) => {
        const position = endpointFor(endpoint);
        const x = rect.left + (position.x / columns) * rect.width;
        const y = rect.top + (position.y / rows) * rect.height;
        return Math.hypot(clientX - x, clientY - y) <= 8;
      }) ?? null;
    }

    function curvedConnectionPath(start, end, operation) {
      const direction = operation === "evaluation" ? -1 : 1;
      const span = Math.hypot(end.x - start.x, end.y - start.y);
      const depth = Math.min(2.2, Math.max(0.8, span * 0.35));
      return `M ${start.x} ${start.y} C ${start.x} ${start.y + direction * depth}, ${end.x} ${end.y + direction * depth}, ${end.x} ${end.y}`;
    }

    function multiplicationPath(firstSource, secondSource, target) {
      const [left, right] = [firstSource, secondSource].sort((first, second) => first.x - second.x);
      const width = right.x - left.x;
      const offset = target.y - left.y;
      const targetOffset = target.x - left.x;
      const junctionY = (left.y + target.y) * 0.5;
      let sourceArc;
      if (targetOffset < width * 0.25) {
        sourceArc = [
          `M ${left.x} ${left.y}`,
          `L ${left.x} ${junctionY}`,
          `L ${left.x + width * 0.75} ${junctionY}`,
          `Q ${right.x} ${junctionY} ${right.x} ${left.y + offset * 0.2}`,
          `L ${right.x} ${right.y}`
        ];
      } else if (targetOffset > width * 0.75) {
        sourceArc = [
          `M ${left.x} ${left.y}`,
          `L ${left.x} ${left.y + offset * 0.2}`,
          `Q ${left.x} ${junctionY} ${left.x + width * 0.25} ${junctionY}`,
          `L ${right.x} ${junctionY}`,
          `L ${right.x} ${right.y}`
        ];
      } else {
        sourceArc = [
          `M ${left.x} ${left.y}`,
          `L ${left.x} ${left.y + offset * 0.2}`,
          `Q ${left.x} ${junctionY} ${left.x + width * 0.25} ${junctionY}`,
          `L ${left.x + width * 0.75} ${junctionY}`,
          `Q ${right.x} ${junctionY} ${right.x} ${left.y + offset * 0.2}`,
          `L ${right.x} ${right.y}`
        ];
      }
      sourceArc.push(`M ${target.x} ${junctionY} L ${target.x} ${target.y}`);
      return sourceArc.join(" ");
    }

    function latexNumber(value) {
      return String(Number(value.toFixed(3)));
    }

    function latexPoint(index) {
      const point = endpointFor(index);
      return { x: point.x, y: rows - point.y };
    }

    function latexCoordinate(point) {
      return `(${latexNumber(point.x)},${latexNumber(point.y)})`;
    }

    function orderedConnectionEntries() {
      return connections
        .map((connection, index) => ({ connection, index }))
        .sort((first, second) => {
          const drawRank = ({ connection, index }) => index === selectedConnectionIndex
            ? 2
            : connection.layer === "up" ? 1 : 0;
          return drawRank(first) - drawRank(second) || first.index - second.index;
        });
    }

    function latexForConnection(connection) {
      const latexColor = diagramColors[connection.color || "black"].latex;
      const isRaised = connection.layer === "up";
      if (connection.kind === "multiplication") {
        const sources = connection.sources.map(latexPoint).sort((first, second) => first.x - second.x);
        const target = latexPoint(connection.target);
        const width = sources[1].x - sources[0].x;
        const targetOffset = target.x - sources[0].x;
        const height = target.y - sources[0].y;
        const argumentsList = `{${latexNumber(sources[0].x)}}{${latexNumber(sources[0].y)}}{${latexNumber(width)}}{${latexNumber(height)}}{${latexColor}}`;
        if (targetOffset < width * 0.25) return `\\dLMult${isRaised ? "O" : ""}[${latexNumber(targetOffset)}]${argumentsList}`;
        if (targetOffset > width * 0.75) return `\\dRMult${isRaised ? "O" : ""}[${latexNumber(targetOffset)}]${argumentsList}`;
        const offsetArgument = Math.abs(targetOffset - width * 0.5) < 0.001 ? "" : `[${latexNumber(targetOffset)}]`;
        return `\\dMult${isRaised ? "O" : ""}${offsetArgument}${argumentsList}`;
      }

      const start = latexPoint(connection.from);
      const end = latexPoint(connection.to);
      if (!curvedConnectionTypes.has(connection.kind)) {
        const line = `\\draw[line width=2.2pt,line cap=round,line join=round,color=${latexColor}] ${latexCoordinate(start)} -- ${latexCoordinate(end)};`;
        return isRaised
          ? `\\draw[line width=6pt,line cap=round,color=white] ${latexCoordinate(start)} -- ${latexCoordinate(end)};\n${line}`
          : line;
      }

      const isPairing = connection.kind === "evaluation";
      if (Math.abs(start.y - end.y) < 0.001 && Math.abs(start.x - end.x) > 0.001) {
        const [left, right] = start.x < end.x ? [start, end] : [end, start];
        const span = Math.hypot(right.x - left.x, right.y - left.y);
        const height = Math.min(2.2, Math.max(0.8, span * 0.35)) + 0.5;
        const command = isPairing ? (isRaised ? "dPairingO" : "dPairing") : (isRaised ? "dCopairingO" : "dCopairing");
        return `\\${command}{${latexNumber(left.x)}}{${latexNumber(left.y)}}{${latexNumber(right.x - left.x)}}{${latexNumber(height)}}{${latexColor}}{}`;
      }

      const direction = isPairing ? 1 : -1;
      const depth = Math.min(2.2, Math.max(0.8, Math.hypot(end.x - start.x, end.y - start.y) * 0.35));
      const curve = (color, width) => `\\draw[line width=${width},line cap=round,line join=round,color=${color}] ${latexCoordinate(start)} .. controls ${latexCoordinate({ x: start.x, y: start.y + direction * depth })} and ${latexCoordinate({ x: end.x, y: end.y + direction * depth })} .. ${latexCoordinate(end)};`;
      return isRaised ? `${curve("white", "6pt")}\n${curve(latexColor, "1.6pt")}` : curve(latexColor, "1.6pt");
    }

    function latexForDiagram() {
      const code = [
        "% Requires named colors, Lentner's \\dPairing and \\dCopairing, and template macros \\dMult, \\dMultO, \\dLMult, \\dLMultO, \\dRMult, \\dRMultO, \\dPairingO, and \\dCopairingO.",
        "\\begin{tikzpicture}[x=1cm,y=1cm,every node/.style={inner sep=0pt}]", 
        `  \\path[use as bounding box] (0,0) rectangle (${columns},${rows});`
      ];

      boxes.forEach((box) => {
        const lowerLeft = { x: box.x, y: rows - box.y - box.height };
        const upperRight = { x: box.x + box.width, y: rows - box.y };
        const latexColor = diagramColors[box.color || "black"].latex;
        code.push(`  \\filldraw[draw=${latexColor},fill=white,line width=1.5pt] ${latexCoordinate(lowerLeft)} rectangle ${latexCoordinate(upperRight)};`);
      });

      circles.forEach((circle) => {
        const center = { x: circle.x, y: rows - circle.y };
        const latexColor = diagramColors[circle.color || "black"].latex;
        code.push(`  \\filldraw[draw=${latexColor},fill=white,line width=1.5pt] ${latexCoordinate(center)} circle[radius=${latexNumber(circle.radius)}cm];`);
        if (circle.text?.trim()) code.push(`  \\node[inner sep=2pt] at ${latexCoordinate(center)} {$${circle.text}$};`);
      });

      orderedConnectionEntries().forEach(({ connection }) => code.push(`  ${latexForConnection(connection)}`));

      boxes.forEach((box) => {
        if (!box.text?.trim()) return;
        const center = { x: box.x + box.width / 2, y: rows - box.y - box.height / 2 };
        code.push(`  \\node[inner sep=2pt] at ${latexCoordinate(center)} {$${box.text}$};`);
      });

      cells.forEach((operation, index) => {
        if (!operation) return;
        const point = latexPoint(index);
        if (operation === "bullet") {
          const latexColor = diagramColors[bulletColors.get(index) || "black"].latex;
          code.push(`  \\filldraw[draw=${latexColor},fill=${latexColor}] ${latexCoordinate(point)} circle[radius=0.055cm];`);
        } else if (operation === "text") {
          const text = textNodeValues.get(index) || "x";
          code.push(`  \\node[inner sep=2pt] at ${latexCoordinate(point)} {$${text}$};`);
        }
      });

      code.push("\\end{tikzpicture}");
      return code.join("\n");
    }

    function appendRaisedUnderlay(element, connection) {
      if (connection.layer !== "up") return;
      const underlay = element.cloneNode(false);
      underlay.setAttribute("class", "wire-underlay");
      wireLayer.append(underlay);
    }

    function renderConnections() {
      if (window.MathJax?.typesetClear) window.MathJax.typesetClear([grid]);
      wireLayer.replaceChildren();
      grid.querySelectorAll(".box-label, .circle-label").forEach((label) => label.remove());
      boxes.forEach(({ x, y, width, height, text }, index) => {
        const rectangle = document.createElementNS(wireLayer.namespaceURI, "rect");
        rectangle.classList.add("diagram-box");
        if (index === selectedBoxIndex) rectangle.classList.add("is-selected");
        rectangle.setAttribute("x", String(x));
        rectangle.setAttribute("y", String(y));
        rectangle.setAttribute("width", String(width));
        rectangle.setAttribute("height", String(height));
        wireLayer.append(rectangle);

        const label = index === selectedBoxIndex && boxLabelDraft !== null ? boxLabelDraft : (text || "");
        if (label.trim()) {
          const labelElement = document.createElement("div");
          labelElement.classList.add("box-label");
          labelElement.style.left = `${(x / columns) * 100}%`;
          labelElement.style.top = `${(y / rows) * 100}%`;
          labelElement.style.width = `${(width / columns) * 100}%`;
          labelElement.style.height = `${(height / rows) * 100}%`;
          labelElement.textContent = `\\(${label}\\)`;
          grid.append(labelElement);
        }
      });

      circles.forEach((circle, index) => {
        const element = document.createElementNS(wireLayer.namespaceURI, "circle");
        element.classList.add("diagram-circle");
        if (index === selectedCircleIndex) element.classList.add("is-selected");
        element.dataset.circleId = String(circle.id);
        element.setAttribute("cx", String(circle.x));
        element.setAttribute("cy", String(circle.y));
        element.setAttribute("r", String(circle.radius));
        element.style.setProperty("--circle-color", diagramColors[circle.color || "black"].css);
        wireLayer.append(element);

        const label = index === selectedCircleIndex && circleLabelDraft !== null ? circleLabelDraft : (circle.text || "");
        if (label.trim()) {
          const labelElement = document.createElement("div");
          labelElement.classList.add("circle-label");
          labelElement.style.left = `${((circle.x - circle.radius) / columns) * 100}%`;
          labelElement.style.top = `${((circle.y - circle.radius) / rows) * 100}%`;
          labelElement.style.width = `${(2 * circle.radius / columns) * 100}%`;
          labelElement.style.height = `${(2 * circle.radius / rows) * 100}%`;
          labelElement.textContent = `\\(${label}\\)`;
          grid.append(labelElement);
        }
      });

      multiplicationSelection.forEach((endpoint) => {
        if (typeof endpoint === "number") return;
        const position = endpointFor(endpoint);
        const highlight = document.createElementNS(wireLayer.namespaceURI, "circle");
        highlight.classList.add("multiplication-port-highlight");
        highlight.setAttribute("cx", String(position.x));
        highlight.setAttribute("cy", String(position.y));
        highlight.setAttribute("r", "0.13");
        wireLayer.append(highlight);
      });

      if (boxStart && boxPreview && boxMoved) {
        const rectangle = document.createElementNS(wireLayer.namespaceURI, "rect");
        rectangle.classList.add("diagram-box", "box-preview");
        rectangle.setAttribute("x", String(Math.min(boxStart.x, boxPreview.x)));
        rectangle.setAttribute("y", String(Math.min(boxStart.y, boxPreview.y)));
        rectangle.setAttribute("width", String(Math.abs(boxPreview.x - boxStart.x)));
        rectangle.setAttribute("height", String(Math.abs(boxPreview.y - boxStart.y)));
        wireLayer.append(rectangle);
      }

      orderedConnectionEntries().forEach(({ connection, index }) => {
        const { from, to, kind, sources, target } = connection;
        const connectionColor = diagramColors[connection.color || "black"].css;
        if (kind === "multiplication") {
          const path = document.createElementNS(wireLayer.namespaceURI, "path");
          path.classList.add("wire-line", "wire-curve", "wire-multiplication");
          if (index === selectedConnectionIndex) path.classList.add("is-selected");
          path.dataset.connectionIndex = String(index);
          path.setAttribute("d", multiplicationPath(endpointFor(sources[0]), endpointFor(sources[1]), endpointFor(target)));
          path.style.setProperty("--connection-color", connectionColor);
          appendRaisedUnderlay(path, connection);
          wireLayer.append(path);
          const hitArea = path.cloneNode(false);
          hitArea.setAttribute("class", "wire-hit-area");
          wireLayer.append(hitArea);
        } else if (curvedConnectionTypes.has(kind)) {
          const start = endpointFor(from);
          const end = endpointFor(to);
          const curve = document.createElementNS(wireLayer.namespaceURI, "path");
          curve.classList.add("wire-line", "wire-curve");
          if (index === selectedConnectionIndex) curve.classList.add("is-selected");
          curve.dataset.connectionIndex = String(index);
          curve.setAttribute("d", curvedConnectionPath(start, end, kind));
          curve.style.setProperty("--connection-color", connectionColor);
          appendRaisedUnderlay(curve, connection);
          wireLayer.append(curve);
          const hitArea = curve.cloneNode(false);
          hitArea.setAttribute("class", "wire-hit-area");
          wireLayer.append(hitArea);
        } else {
          const start = endpointFor(from);
          const end = endpointFor(to);
          const line = document.createElementNS(wireLayer.namespaceURI, "line");
          line.classList.add("wire-line");
          if (index === selectedConnectionIndex) line.classList.add("is-selected");
          line.dataset.connectionIndex = String(index);
          line.setAttribute("x1", String(start.x));
          line.setAttribute("y1", String(start.y));
          line.setAttribute("x2", String(end.x));
          line.setAttribute("y2", String(end.y));
          line.style.setProperty("--connection-color", connectionColor);
          appendRaisedUnderlay(line, connection);
          wireLayer.append(line);
          const hitArea = line.cloneNode(false);
          hitArea.setAttribute("class", "wire-hit-area");
          wireLayer.append(hitArea);
        }
      });

      if (wireStartIndex !== null && wirePreview && wireMoved) {
        const start = endpointFor(wireStartIndex);
        if (wireStartOperation) {
          const curve = document.createElementNS(wireLayer.namespaceURI, "path");
          curve.classList.add("wire-line", "wire-curve", "wire-preview");
          curve.setAttribute("d", curvedConnectionPath(start, wirePreview, wireStartOperation));
          wireLayer.append(curve);
        } else {
          const line = document.createElementNS(wireLayer.namespaceURI, "line");
          line.classList.add("wire-line", "wire-preview");
          line.setAttribute("x1", String(start.x));
          line.setAttribute("y1", String(start.y));
          line.setAttribute("x2", String(wirePreview.x));
          line.setAttribute("y2", String(wirePreview.y));
          wireLayer.append(line);
        }
      }
      updateCircleEditor();
      updateColorPalette();
      updateConnectionLayerControls();
      scheduleMathTypeset();
    }

    function captureState() {
      return {
        columns,
        rows,
        cells: [...cells],
        points: [...points],
        textNodes: [...textNodeValues.entries()],
        bulletColors: [...bulletColors.entries()],
        connections: connections.map((connection) => connection.kind === "multiplication"
          ? { ...connection, sources: [...connection.sources] }
          : { ...connection }),
        boxes: boxes.map((box) => ({ ...box })),
        circles: circles.map((circle) => ({ ...circle }))
      };
    }

    function restoreState(state) {
      columns = state.columns;
      rows = state.rows;
      cells = [...state.cells];
      points.clear();
      state.points.forEach((index) => points.add(index));
      textNodeValues.clear();
      state.textNodes.forEach(([index, text]) => textNodeValues.set(index, text));
      bulletColors.clear();
      state.bulletColors.forEach(([index, color]) => bulletColors.set(index, color));
      connections.splice(0, connections.length, ...state.connections);
      boxes.splice(0, boxes.length, ...state.boxes);
      circles.splice(0, circles.length, ...state.circles);
      selectedCellIndex = null;
      selectedBoxIndex = null;
      selectedCircleIndex = null;
      selectedConnectionIndex = null;
      multiplicationSelection = [];
      boxLabelDraft = null;
    }

    function shiftedEndpoint(endpoint, axis, previousColumns) {
      if (typeof endpoint !== "number") {
        return { ...endpoint, [axis]: endpoint[axis] + 1 };
      }
      if (axis === "x") {
        const row = Math.floor(endpoint / previousColumns);
        const column = endpoint % previousColumns;
        return row * (previousColumns + 1) + column + 1;
      }
      return endpoint + previousColumns;
    }

    function insertColumnAtLeft() {
      snapshot();
      const previousColumns = columns;
      const expandedCells = Array((columns + 1) * rows).fill(null);
      cells.forEach((operation, index) => {
        const row = Math.floor(index / previousColumns);
        const column = index % previousColumns;
        expandedCells[row * (previousColumns + 1) + column + 1] = operation;
      });
      const shiftedPoints = [...points].map((index) => shiftedEndpoint(index, "x", previousColumns));
      const shiftedTextNodes = [...textNodeValues].map(([index, text]) => [shiftedEndpoint(index, "x", previousColumns), text]);
      const shiftedBulletColors = [...bulletColors].map(([index, color]) => [shiftedEndpoint(index, "x", previousColumns), color]);
      multiplicationSelection = multiplicationSelection.map((index) => shiftedEndpoint(index, "x", previousColumns));
      connections.forEach((connection) => {
        if (connection.kind === "multiplication") {
          connection.sources = connection.sources.map((index) => shiftedEndpoint(index, "x", previousColumns));
          connection.target = shiftedEndpoint(connection.target, "x", previousColumns);
        } else {
          if (connection.kind === "multiplication") {
            connection.sources = connection.sources.map((index) => shiftedEndpoint(index, "x", previousColumns));
            connection.target = shiftedEndpoint(connection.target, "x", previousColumns);
          } else {
            connection.from = shiftedEndpoint(connection.from, "x", previousColumns);
            connection.to = shiftedEndpoint(connection.to, "x", previousColumns);
          }
        }
      });
      boxes.forEach((box) => { box.x += 1; });
      circles.forEach((circle) => { circle.x += 1; });
      if (selectedCellIndex !== null) selectedCellIndex = shiftedEndpoint(selectedCellIndex, "x", previousColumns);
      columns += 1;
      cells = expandedCells;
      points.clear();
      shiftedPoints.forEach((index) => points.add(index));
      textNodeValues.clear();
      shiftedTextNodes.forEach(([index, text]) => textNodeValues.set(index, text));
      bulletColors.clear();
      shiftedBulletColors.forEach(([index, color]) => bulletColors.set(index, color));
      announce("Column added to the left edge");
      renderGrid();
    }

    function insertColumnAtRight() {
      snapshot();
      const previousColumns = columns;
      const nextColumns = previousColumns + 1;
      const expandedCells = Array(nextColumns * rows).fill(null);
      const remapEndpoint = (endpoint) => {
        if (typeof endpoint !== "number") return { ...endpoint };
        const row = Math.floor(endpoint / previousColumns);
        const column = endpoint % previousColumns;
        return row * nextColumns + column;
      };

      cells.forEach((operation, index) => {
        const row = Math.floor(index / previousColumns);
        const column = index % previousColumns;
        expandedCells[row * nextColumns + column] = operation;
      });
      const shiftedPoints = [...points].map(remapEndpoint);
      const shiftedTextNodes = [...textNodeValues].map(([index, text]) => [remapEndpoint(index), text]);
      const shiftedBulletColors = [...bulletColors].map(([index, color]) => [remapEndpoint(index), color]);
      multiplicationSelection = multiplicationSelection.map(remapEndpoint);
      connections.forEach((connection) => {
        if (connection.kind === "multiplication") {
          connection.sources = connection.sources.map(remapEndpoint);
          connection.target = remapEndpoint(connection.target);
        } else {
          connection.from = remapEndpoint(connection.from);
          connection.to = remapEndpoint(connection.to);
        }
      });
      if (selectedCellIndex !== null) selectedCellIndex = remapEndpoint(selectedCellIndex);
      columns = nextColumns;
      cells = expandedCells;
      points.clear();
      shiftedPoints.forEach((index) => points.add(index));
      textNodeValues.clear();
      shiftedTextNodes.forEach(([index, text]) => textNodeValues.set(index, text));
      bulletColors.clear();
      shiftedBulletColors.forEach(([index, color]) => bulletColors.set(index, color));
      announce("Column added to the right edge");
      renderGrid();
    }

    function insertRowAtTop() {
      snapshot();
      const previousColumns = columns;
      const expandedCells = Array(columns * (rows + 1)).fill(null);
      cells.forEach((operation, index) => {
        expandedCells[index + previousColumns] = operation;
      });
      const shiftedPoints = [...points].map((index) => shiftedEndpoint(index, "y", previousColumns));
      const shiftedTextNodes = [...textNodeValues].map(([index, text]) => [shiftedEndpoint(index, "y", previousColumns), text]);
      const shiftedBulletColors = [...bulletColors].map(([index, color]) => [shiftedEndpoint(index, "y", previousColumns), color]);
      multiplicationSelection = multiplicationSelection.map((index) => shiftedEndpoint(index, "y", previousColumns));
      connections.forEach((connection) => {
        if (connection.kind === "multiplication") {
          connection.sources = connection.sources.map((index) => shiftedEndpoint(index, "y", previousColumns));
          connection.target = shiftedEndpoint(connection.target, "y", previousColumns);
        } else {
          if (connection.kind === "multiplication") {
            connection.sources = connection.sources.map((index) => shiftedEndpoint(index, "y", previousColumns));
            connection.target = shiftedEndpoint(connection.target, "y", previousColumns);
          } else {
            connection.from = shiftedEndpoint(connection.from, "y", previousColumns);
            connection.to = shiftedEndpoint(connection.to, "y", previousColumns);
          }
        }
      });
      boxes.forEach((box) => { box.y += 1; });
      circles.forEach((circle) => { circle.y += 1; });
      if (selectedCellIndex !== null) selectedCellIndex = shiftedEndpoint(selectedCellIndex, "y", previousColumns);
      rows += 1;
      cells = expandedCells;
      points.clear();
      shiftedPoints.forEach((index) => points.add(index));
      textNodeValues.clear();
      shiftedTextNodes.forEach(([index, text]) => textNodeValues.set(index, text));
      bulletColors.clear();
      shiftedBulletColors.forEach(([index, color]) => bulletColors.set(index, color));
      announce("Row added to the top edge");
      renderGrid();
    }

    function insertRowAtBottom() {
      snapshot();
      rows += 1;
      cells = [...cells, ...Array(columns).fill(null)];
      announce("Row added to the bottom edge");
      renderGrid();
    }

    function updateActions() {
      undoButton.disabled = undoStack.length === 0;
      redoButton.disabled = redoStack.length === 0;
      clearButton.disabled = cells.every((operation) => operation === null) && points.size === 0 && connections.length === 0 && boxes.length === 0 && circles.length === 0;
    }

    function updateCount() {
      const bulletCount = cells.filter((operation) => operation === "bullet").length;
      const textNodeCount = cells.filter((operation) => operation === "text").length;
      const pointLabel = points.size === 1 ? "point" : "points";
      const lineLabel = connections.length === 1 ? "line" : "lines";
      const boxLabel = boxes.length === 1 ? "box" : "boxes";
      const circleLabel = circles.length === 1 ? "circle" : "circles";
      const bulletLabel = bulletCount === 1 ? "bullet" : "bullets";
      const textLabel = textNodeCount === 1 ? "text node" : "text nodes";
      cellCount.textContent = `${bulletCount} ${bulletLabel} · ${textNodeCount} ${textLabel} · ${points.size} ${pointLabel} · ${connections.length} ${lineLabel} · ${boxes.length} ${boxLabel} · ${circles.length} ${circleLabel}`;
    }

    function snapshot() {
      // Save each pre-edit state once; a new edit invalidates the redo branch.
      undoStack.push(captureState());
      if (undoStack.length > 100) undoStack.shift();
      redoStack.length = 0;
    }

    function activateCurvedConnection(operationKey) {
      boxMode = false;
      circleMode = false;
      textNodeMode = false;
      boxButton.setAttribute("aria-pressed", "false");
      circleButton.setAttribute("aria-pressed", "false");
      textNodeButton.setAttribute("aria-pressed", "false");
      evaluationButton.setAttribute("aria-pressed", String(operationKey === "evaluation"));
      coevaluationButton.setAttribute("aria-pressed", String(operationKey === "coevaluation"));
      bulletButton.setAttribute("aria-pressed", "false");
      multiplicationButton.setAttribute("aria-pressed", "false");
      selectedOperation = operationKey;
      selectedCellIndex = null;
      selectedBoxIndex = null;
      selectedCircleIndex = null;
      selectedConnectionIndex = null;
      multiplicationSelection = [];
      boxLabelDraft = null;
      textNodeDraft = null;
      activeLabel.textContent = operations[operationKey].label;
      activeTool.dataset.category = "tensor";
      activeInstructions.hidden = true;
      announce(`Drag between two nodes to draw a ${operationKey === "evaluation" ? "cap" : "cup"}`);
      renderGrid();
    }

    evaluationButton.addEventListener("click", () => activateCurvedConnection("evaluation"));
    coevaluationButton.addEventListener("click", () => activateCurvedConnection("coevaluation"));
    bulletButton.addEventListener("click", activateBulletMode);
    multiplicationButton.addEventListener("click", toggleMultiplicationMode);
    colorSwatches.forEach((swatch) => {
      swatch.addEventListener("click", () => applyColorToSelection(swatch.dataset.color));
    });
    connectionUpButton.addEventListener("click", () => setConnectionLayer("up"));
    connectionDownButton.addEventListener("click", () => setConnectionLayer("down"));
    boxButton.addEventListener("click", () => setBoxMode(!boxMode));
    circleButton.addEventListener("click", () => setCircleMode(!circleMode));
    textNodeButton.addEventListener("click", () => setTextNodeMode(!textNodeMode));
    selectModeButton.addEventListener("click", setDefaultMode);
    addRowButton.addEventListener("click", insertRowAtTop);
    addColumnButton.addEventListener("click", insertColumnAtLeft);
    addRowBottomButton.addEventListener("click", insertRowAtBottom);
    addColumnRightButton.addEventListener("click", insertColumnAtRight);
    zoomOutButton.addEventListener("click", () => setCanvasZoom(canvasZoom - 0.1));
    zoomInButton.addEventListener("click", () => setCanvasZoom(canvasZoom + 0.1));
    zoomResetButton.addEventListener("click", () => setCanvasZoom(1));
    exportLatexButton.addEventListener("click", () => {
      latexOutput.value = latexForDiagram();
      latexCopyStatus.textContent = "";
      latexDialog.showModal();
    });
    closeLatexButton.addEventListener("click", () => latexDialog.close());
    copyLatexButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(latexOutput.value);
        latexCopyStatus.textContent = "Copied to clipboard.";
      } catch {
        latexOutput.focus();
        latexOutput.select();
        const copied = document.execCommand("copy");
        latexCopyStatus.textContent = copied ? "Copied to clipboard." : "Code selected. Press Ctrl+C to copy.";
      }
    });
    canvasViewport.addEventListener("wheel", (event) => {
      if (event.ctrlKey) return;
      event.preventDefault();
      if (event.shiftKey) {
        canvasViewport.scrollLeft += event.deltaY || event.deltaX;
      } else {
        canvasViewport.scrollLeft += event.deltaX;
        canvasViewport.scrollTop += event.deltaY;
      }
    }, { passive: false });
    window.addEventListener("resize", updateCanvasZoom);
    boxLabelInput.addEventListener("input", () => {
      if (selectedBoxIndex === null) return;
      boxLabelDraft = boxLabelInput.value;
      renderConnections();
    });
    boxLabelInput.addEventListener("change", commitBoxLabel);
    deleteBoxButton.addEventListener("click", deleteSelectedBox);
    circleLabelInput.addEventListener("input", () => {
      if (selectedCircleIndex === null) return;
      circleLabelDraft = circleLabelInput.value;
      renderConnections();
    });
    circleLabelInput.addEventListener("change", commitCircleLabel);
    deleteCircleButton.addEventListener("click", deleteSelectedCircle);
    textNodeInput.addEventListener("input", () => {
      if (selectedCellIndex === null || cells[selectedCellIndex] !== "text") return;
      textNodeDraft = textNodeInput.value;
      renderGrid();
    });
    textNodeInput.addEventListener("change", commitTextNode);

    // Drag between occupied cells and box borders to connect diagram endpoints.
    grid.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;

      if (boxMode) {
        boxStart = gridPointAt(event.clientX, event.clientY);
        boxPreview = boxStart;
        boxStartPointer = { x: event.clientX, y: event.clientY };
        boxMoved = false;
        event.preventDefault();
        return;
      }

      if (selectedOperation === "multiplication") {
        event.preventDefault();
        return;
      }

      const endpoint = wireEndpointAt(event);
      if (endpoint === null) return;
      wireStartOperation = curvedConnectionTypes.has(selectedOperation) ? selectedOperation : null;
      if (wireStartOperation && typeof endpoint !== "number") {
        wireStartOperation = null;
        return;
      }
      wireStartIndex = endpoint;
      wireStartPointer = { x: event.clientX, y: event.clientY };
      wirePreview = endpointFor(endpoint);
      wireMoved = false;
      grid.classList.add("is-wiring");
    });

    document.addEventListener("pointermove", (event) => {
      if (boxStart) {
        boxPreview = gridPointAt(event.clientX, event.clientY);
        boxMoved ||= Math.hypot(event.clientX - boxStartPointer.x, event.clientY - boxStartPointer.y) > 4;
        renderConnections();
        return;
      }
      if (wireStartIndex === null) return;
      const rect = grid.getBoundingClientRect();
      wirePreview = {
        x: ((event.clientX - rect.left) / rect.width) * columns,
        y: ((event.clientY - rect.top) / rect.height) * rows
      };
      wireMoved ||= Math.hypot(event.clientX - wireStartPointer.x, event.clientY - wireStartPointer.y) > 4;
      renderConnections();
    });

    document.addEventListener("pointerup", (event) => {
      if (boxStart) {
        if (boxMoved) {
          const x = Math.min(boxStart.x, boxPreview.x);
          const y = Math.min(boxStart.y, boxPreview.y);
          const width = Math.abs(boxPreview.x - boxStart.x);
          const height = Math.abs(boxPreview.y - boxStart.y);
          suppressNextClick = true;
          setTimeout(() => { suppressNextClick = false; }, 250);
          if (width > 0 && height > 0) {
            snapshot();
            boxes.push({ id: nextBoxId++, x, y, width, height });
            announce("Box drawn with half-cell corner snapping");
          } else {
            announce("A box needs nonzero width and height");
          }
        }
        boxStart = null;
        boxStartPointer = null;
        boxPreview = null;
        boxMoved = false;
        renderConnections();
        updateActions();
        return;
      }
      if (wireStartIndex === null) return;
      const start = wireStartIndex;
      const end = wireEndpointAt(event);
      const kind = wireStartOperation;
      const wasDrag = wireMoved;

      if (wasDrag) {
        suppressNextClick = true;
        setTimeout(() => { suppressNextClick = false; }, 250);
        if (end === null || (kind && typeof end !== "number")) {
          announce(kind ? "Evaluation and coevaluation connect two nodes" : "Connect wires to an operation, point, or box border");
        } else {
          const startKey = endpointKey(start);
          const endKey = endpointKey(end);
          const alreadyConnected = connections.some((connection) =>
            connection.kind !== "multiplication" && (
            (endpointKey(connection.from) === startKey && endpointKey(connection.to) === endKey) ||
            (endpointKey(connection.from) === endKey && endpointKey(connection.to) === startKey))
          );
          if (startKey === endKey) {
            announce("Choose a different endpoint to connect");
          } else if (alreadyConnected) {
            announce("Those operations are already connected");
          } else {
            snapshot();
            connections.push({ from: start, to: end, kind, color: "black" });
            announce(kind ? `${operations[kind].label} connected` : "Wire connected");
          }
        }
      }

      wireStartIndex = null;
      wireStartOperation = null;
      wireStartPointer = null;
      wirePreview = null;
      wireMoved = false;
      suppressNextClick = false;
      grid.classList.remove("is-wiring");
      if (wasDrag) {
        renderConnections();
        updateActions();
        updateCount();
      }
    });

    document.addEventListener("pointercancel", () => {
      boxStart = null;
      boxStartPointer = null;
      boxPreview = null;
      boxMoved = false;
      wireStartIndex = null;
      wireStartOperation = null;
      wireStartPointer = null;
      wirePreview = null;
      wireMoved = false;
      grid.classList.remove("is-wiring");
      renderConnections();
    });

    grid.addEventListener("click", (event) => {
      if (suppressNextClick) {
        suppressNextClick = false;
        event.preventDefault();
        return;
      }
      const wire = event.target.closest?.(".wire-hit-area");
      if (!selectedOperation && !boxMode && !textNodeMode && wire) {
        const connectionIndex = Number(wire.dataset.connectionIndex);
        const endpoint = nodeNearConnectionEndpoint(connections[connectionIndex], event.clientX, event.clientY);
        selectedConnectionIndex = endpoint === null ? connectionIndex : null;
        selectedCellIndex = null;
        selectedBoxIndex = null;
        selectedCircleIndex = null;
        boxLabelDraft = null;
        textNodeDraft = null;
        updateBoxEditor();
        updateTextNodeEditor();
        if (typeof endpoint === "number") {
          selectedCellIndex = endpoint;
          announce(cells[endpoint] ? `${operations[cells[endpoint]].label} selected` : "Orientation point selected");
          renderGrid();
        } else if (endpoint?.circleId !== undefined) {
          selectCircle(circles.findIndex((circle) => circle.id === endpoint.circleId));
        } else if (endpoint?.boxId !== undefined) {
          selectBox(boxes.findIndex((box) => box.id === endpoint.boxId));
        } else {
          announce("Wire selected; press Backspace to delete it");
          renderConnections();
        }
        return;
      }
      const point = gridPositionAt(event.clientX, event.clientY);
      const cell = event.target.closest(".grid-cell");
      const index = cell ? Number(cell.dataset.index) : null;
      if (boxMode) return;

      if (circleMode) {
        const column = Math.min(columns - 1, Math.max(0, Math.floor(point.x)));
        const row = Math.min(rows - 1, Math.max(0, Math.floor(point.y)));
        const cellIndex = row * columns + column;
        const alreadyHasCircle = circles.some((circle) => Math.floor(circle.x) === column && Math.floor(circle.y) === row);
        if (hasNode(cellIndex) || alreadyHasCircle) {
          announce("That cell already contains a node or circle");
          return;
        }
        snapshot();
        circles.push({ id: nextCircleId++, x: column + 0.5, y: row + 0.5, radius: 0.5 });
        announce("Inscribed circle added with four invisible cardinal nodes");
        renderGrid();
        return;
      }

      const circleElement = event.target.closest?.(".diagram-circle");
      if (!selectedOperation && !textNodeMode && circleElement) {
        selectCircle(circles.findIndex((circle) => circle.id === Number(circleElement.dataset.circleId)));
        return;
      }

      if (selectedOperation === "multiplication") {
        const selectedEndpoint = wireEndpointAt(event);
        if (selectedEndpoint === null) {
          announce("Choose a node or circle port for multiplication");
          return;
        }
        const selectedKey = endpointKey(selectedEndpoint);
        const existingSelectionIndex = multiplicationSelection.findIndex((endpoint) => endpointKey(endpoint) === selectedKey);
        if (existingSelectionIndex !== -1) {
          multiplicationSelection.splice(existingSelectionIndex, 1);
          activeInstructions.textContent = multiplicationSelection.length === 0
            ? "Select two nodes, including light-blue points and circle ports, on the same row; then select a target centered above or below them."
            : "Source 1 selected. Select a second node or circle port on the same row.";
          announce("Multiplication node deselected");
          renderGrid();
          return;
        }

        const selectedPoint = endpointFor(selectedEndpoint);
        if (multiplicationSelection.length === 1) {
          const firstSource = endpointFor(multiplicationSelection[0]);
          if (selectedPoint.y !== firstSource.y) {
            announce("Both source nodes must be on the same row");
            return;
          }
        }
        if (multiplicationSelection.length === 2) {
          const [firstSource, secondSource] = multiplicationSelection.map(endpointFor);
          const minimumX = Math.min(firstSource.x, secondSource.x);
          const maximumX = Math.max(firstSource.x, secondSource.x);
          if (selectedPoint.x < minimumX - 0.001 || selectedPoint.x > maximumX + 0.001) {
            announce("Place the target between the two sources");
            return;
          }
          if (multiplicationSelection.some((source) => endpointKey(source) === selectedKey)) {
            announce("Choose a target distinct from the source nodes");
            return;
          }
          const selectedSources = multiplicationSelection.map(endpointKey);
          const duplicate = connections.some((connection) =>
            connection.kind === "multiplication" &&
            endpointKey(connection.target) === selectedKey &&
            selectedSources.every((key) => connection.sources.some((source) => endpointKey(source) === key))
          );
          if (duplicate) {
            announce("Those nodes already form a multiplication");
            return;
          }
          snapshot();
          connections.push({ kind: "multiplication", sources: [...multiplicationSelection], target: selectedEndpoint, color: "black" });
          multiplicationSelection = [];
          selectedCellIndex = null;
          selectedBoxIndex = null;
          selectedCircleIndex = null;
          selectedConnectionIndex = null;
          activeInstructions.textContent = "Select two nodes, including light-blue points and circle ports, on the same row; then select a target centered above or below them.";
          announce("Multiplication connected");
          renderGrid();
          updateActions();
          updateCount();
          return;
        }

        multiplicationSelection.push(selectedEndpoint);
        activeInstructions.textContent = multiplicationSelection.length === 1
          ? "Source 1 selected. Select a second node or circle port on the same row."
          : "Two sources selected. Select a distinct target centered above or below them.";
        announce(multiplicationSelection.length === 1 ? "Select the second source node on the same row" : "Select the target node centered above or below the sources");
        renderGrid();
        return;
      }

      if (!selectedOperation && (index === null || !hasNode(index))) {
        const boxIndex = boxAtInterior(point);
        if (boxIndex !== null) {
          selectBox(boxIndex);
          return;
        }
      }

      if (!cell) return;

      if (curvedConnectionTypes.has(selectedOperation)) {
        announce(`Drag between two nodes to draw a ${selectedOperation === "evaluation" ? "cap" : "cup"}`);
        return;
      }

      if (textNodeMode) {
        if (hasNode(index)) {
          announce("Cell already contains a node");
          return;
        }
        if (boxes.some((box) => point.x >= box.x && point.x <= box.x + box.width && point.y >= box.y && point.y <= box.y + box.height)) {
          announce("Nodes cannot be placed inside a box");
          return;
        }
        snapshot();
        cells[index] = "text";
        textNodeValues.set(index, "x");
        selectedCellIndex = index;
        textNodeMode = false;
        textNodeButton.setAttribute("aria-pressed", "false");
        activeLabel.textContent = "None";
        activeTool.dataset.category = "";
        announce("Text node placed; enter its LaTeX expression");
        renderGrid();
        return;
      }

      if (!selectedOperation) {
        if (hasNode(index)) {
          selectedBoxIndex = null;
          selectedConnectionIndex = null;
          boxLabelDraft = null;
          updateBoxEditor();
          selectedCellIndex = index;
          announce(cells[index] ? `${operations[cells[index]].label} selected` : "Orientation point selected");
          renderGrid();
        } else {
          selectedBoxIndex = null;
          selectedConnectionIndex = null;
          boxLabelDraft = null;
          updateBoxEditor();
          snapshot();
          points.add(index);
          selectedCellIndex = index;
          announce(`Orientation point placed in column ${(index % columns) + 1}, row ${Math.floor(index / columns) + 1}`);
          renderGrid();
        }
        return;
      }

      if (hasNode(index)) {
        announce("Cell already contains an operation");
        return;
      }

      if (boxes.some((box) => point.x >= box.x && point.x <= box.x + box.width && point.y >= box.y && point.y <= box.y + box.height)) {
        announce("Nodes cannot be placed inside a box");
        return;
      }

      snapshot();
      cells[index] = selectedOperation;
      selectedCellIndex = null;
      const row = Math.floor(index / columns) + 1;
      const column = (index % columns) + 1;
      announce(`${operations[selectedOperation].label} placed at column ${column}, row ${row}`);
      renderGrid();
    });

    undoButton.addEventListener("click", () => {
      if (!undoStack.length) return;
      redoStack.push(captureState());
      restoreState(undoStack.pop());
      announce("Undo complete");
      renderGrid();
    });

    redoButton.addEventListener("click", () => {
      if (!redoStack.length) return;
      undoStack.push(captureState());
      restoreState(redoStack.pop());
      announce("Redo complete");
      renderGrid();
    });

    clearButton.addEventListener("click", () => {
      if (cells.every((operation) => operation === null) && points.size === 0 && connections.length === 0 && boxes.length === 0 && circles.length === 0) return;
      snapshot();
      cells.fill(null);
      points.clear();
      textNodeValues.clear();
      bulletColors.clear();
      connections.length = 0;
      boxes.length = 0;
      circles.length = 0;
        multiplicationSelection = [];
      selectedCellIndex = null;
      selectedBoxIndex = null;
      selectedCircleIndex = null;
      selectedConnectionIndex = null;
      boxLabelDraft = null;
      announce("Diagram cleared");
      renderGrid();
    });

    document.addEventListener("keydown", (event) => {
      if (event.target === circleLabelInput) {
        if (event.key === "Escape") {
          event.preventDefault();
          selectedCircleIndex = null;
          circleLabelDraft = null;
          updateCircleEditor();
          renderConnections();
          announce("Circle deselected");
        }
        return;
      }

      if (event.target === boxLabelInput) {
        if (event.key === "Escape") {
          event.preventDefault();
          selectedBoxIndex = null;
          boxLabelDraft = null;
          updateBoxEditor();
          renderConnections();
          announce("Box deselected");
        }
        return;
      }

      if (event.code === "Space" && !event.repeat && (selectedOperation || boxMode || circleMode || textNodeMode) &&
        !event.target.matches("input, textarea, select, [contenteditable='true']")) {
        event.preventDefault();
        setDefaultMode();
        return;
      }

      if (event.target === textNodeInput) {
        if (event.key === "Escape") {
          event.preventDefault();
          selectedCellIndex = null;
          textNodeDraft = null;
          updateTextNodeEditor();
          renderGrid();
          announce("Text node deselected");
        }
        return;
      }

      if (!event.repeat && !event.ctrlKey && !event.altKey && !event.metaKey &&
        !(event.target instanceof HTMLElement && event.target.matches("input, textarea, select, [contenteditable='true']")) &&
        !latexDialog.open) {
        const shortcuts = {
          e: () => activateCurvedConnection("evaluation"),
          c: () => activateCurvedConnection("coevaluation"),
          b: activateBulletMode,
          m: toggleMultiplicationMode
        };
        const activate = shortcuts[event.key.toLowerCase()];
        if (activate) {
          event.preventDefault();
          activate();
          return;
        }
      }

      // Escape returns to selection; deletion applies to the selected box or marker.
      if (event.key === "Escape") {
        setDefaultMode();
      } else if ((event.key === "Delete" || event.key === "Backspace") && selectedBoxIndex !== null) {
        event.preventDefault();
        deleteSelectedBox();
      } else if ((event.key === "Delete" || event.key === "Backspace") && selectedCircleIndex !== null) {
        event.preventDefault();
        deleteSelectedCircle();
      } else if ((event.key === "Delete" || event.key === "Backspace") && selectedCellIndex !== null) {
        event.preventDefault();
        snapshot();
        if (points.has(selectedCellIndex)) {
          points.delete(selectedCellIndex);
        } else {
          bulletColors.delete(selectedCellIndex);
          cells[selectedCellIndex] = null;
          textNodeValues.delete(selectedCellIndex);
        }
        for (let index = connections.length - 1; index >= 0; index -= 1) {
          if (connectionUsesNode(connections[index], selectedCellIndex)) {
            connections.splice(index, 1);
          }
        }
        selectedCellIndex = null;
        textNodeDraft = null;
        announce("Operation deleted");
        renderGrid();
      } else if ((event.key === "Delete" || event.key === "Backspace") && selectedConnectionIndex !== null) {
        event.preventDefault();
        snapshot();
        connections.splice(selectedConnectionIndex, 1);
        selectedConnectionIndex = null;
        announce("Wire deleted");
        renderConnections();
        updateActions();
        updateCount();
      } else if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
        event.preventDefault();
        (event.shiftKey ? redoButton : undoButton).click();
      }
    });

    updateCanvasZoom();
    renderGrid();
  </script>
</body>
</html>
